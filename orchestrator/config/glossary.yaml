# 术语对照表 —— 内部编号 → 人话名（零术语纪律的单一数据源）
#
# 为什么要有这个文件：证据链与轨迹里到处是 `P-SLOT-FREE`、`R1`、`F4` 这类**内部编号**，
# 它们是给实现者看的，不是给观众看的。三审 P1-3 与界面呈现方案 M1/N6 都点名要求
# "界面上不出现编号黑话"。做法不是在前端写死一份映射（那就成了第二份真相源），
# 而是：**这里定义，接口下发，界面消费**（GET /api/meta/glossary）。
#
# 纪律：
#   · 命题部分的键必须与 config/propositions.yaml 的 id 一一对应（启动时校验，缺一个就拒绝启动）
#   · 事实（F1–F6）与规则（W1–W13 / R1–R10）的编号在代码里（fact-collectors.js / verdict-rules.js），
#     由测试反向校验覆盖完整（test/glossary.test.mjs）——不许漏一个编号没有名字
#   · 名字要"人话"：说清"这条在判什么/这一步发生了什么"，不用术语（不写"命题""判定行"）

facts:
  F1: 这间教室的详情
  F2: 这间教室的座位布局
  F3: 这些座位在这段时间的占用情况
  F4: 全量预约记录（跨身份查看）
  F5: 我名下的预约
  F6: 这间教室的检修安排

propositions:
  P-CLASSROOM-EXISTS: 找到了这间教室
  P-CLASSROOM-ENABLED: 这间教室现在可以预约
  P-NOT-ALREADY-MINE: 我没有重复提交过同一时段
  P-SLOT-FREE: 这个时段是空的
  P-NOT-UNDER-MAINTENANCE: 这间教室这段时间不在检修
  P-IS-MINE: 这条预约是我本人的
  P-SLOT-FREE-EXCLUDING-SELF: 想换到的时段是空的（不含我正在改的这条）
  P-SEAT-EXISTS: 这个座位存在
  P-SEAT-SLOT-FREE: 这个座位这段时间是空的

# 槽位短名：理解层把用户的原话解析成这些槽位。"理解结果"要显示给观众，
# 所以界面上显示的是短名（"教室=数智楼123、日期=明天"），不是英文键名（classroomName）。
# 校验：意图计划里用到的每一个槽位键（required / optional / slotHints）都必须在这里有短名。
slots:
  classroomName: 教室
  datePhrase: 日期
  timeSegment: 时段
  originalDatePhrase: 原来的日期
  originalTimeSegment: 原来的时段
  reason: 事由
  seatNumber: 座位号
  seatId: 座位

rules:
  W1: 提交成功
  W2: 提交结果存疑——可能是重复提交，也可能是别人先占了，要去核对
  W3: 系统拒绝了这次提交（权限不足）
  W4: 提交没被接受（参数或业务规则不允许）
  W5: 收到一个没登记过的业务码，结果无法判定
  W6: 返回内容不是约定格式，结果无法判定
  W7: 登录凭证失效了，提交结果不明——不能直接重试
  W8: 系统在入口就拒绝了这次提交（权限不足）
  W9: 服务端出错，提交是否生效不明
  W10: 收到没预期的响应，结果无法判定
  W11: 没有等到回应（超时或连接中断），提交是否生效不明
  W12: 返回内容无法解析，结果无法判定
  W13: 要操作的那条记录不存在
  R1: 读取成功
  R2: 查询参数不被接受
  R3: 系统拒绝了这次查询（权限不足）
  R4: 查询返回了冲突——只读场景下属于异常
  R5: 收到一个没登记过的业务码，读不到数据
  R6: 登录凭证失效了，已自动重新登录并重试
  R7: 系统在入口就拒绝了这次查询（权限不足）
  R8: 服务端出错，正在重试
  R9: 没有等到回应，正在重试
  R10: 重试到上限仍拿不到数据，如实告知"暂时查不到"
