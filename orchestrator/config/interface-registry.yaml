# =============================================================================
# 接口注册表 —— 第 13 章阶段 0 交付物 3（K4 三审拍板：独立成文件）
#
# 每条接口声明第 01 章 §四 的 13 个字段；少一个字段，就少一道防线。
# 数据依据：第 01 章 §五/§六 + docs/基线文档/存量系统改造说明.md（实测事实库）。
# 自动编排标志（三审核准，D2/M8）：classroom.create=是、cancel=是（补偿动作）、
# seat.create=否（D2）、maintenance.create=否（M8）。
# 纪律：本文件不得出现任何凭证；判定规则行号（W/R）编号稳定，改动须走变更记录（C15）。
# =============================================================================

interfaces:

  # ── 1 ── 认证 ────────────────────────────────────────────────────────────
  - id: auth.login
    domain: auth
    method: POST
    path: /auth/login
    timeoutClass: read
    purpose: 登录换取 access token；兼作凭证刷新路径（J5 三审拍板：读 401 透明重登，写 401 先查证）
    requiredIdentity: none
    sideEffect: false
    autoOrchestration: false   # 不被意图计划引用；由接触层按需调用（登录/刷新）
    idempotentBusinessKey: null
    verification: null
    compensation: null         # 无副作用，无补偿语义
    preconditions: []
    adapter: auth-token
    legacyNotes:
      - 上游文档给的 student01/student01 账号是错的（实测 401）；可用账号见根 README
      - 真实路径没有 /api 前缀（上游文档 6 处不一致之一）
      - access token 实测有效期 30 分钟
      - 登录响应含 accessToken + refreshToken + userInfo（role/creditLevel/个人时长上限）——
        openapi 写的 "token" 与实现不符（上游文档不一致，见基线文档 §九）
      - 缺 X-Device-Id 时回落为 unknown-device（多个无头登录会共享同一设备名额，是隐性坑）

  - id: auth.refresh
    domain: auth
    method: POST
    path: /auth/refresh
    timeoutClass: read
    purpose: 用刷新令牌续期（登录会话的续期路径；三审拍板"自动续期一次"的落实处）
    requiredIdentity: none
    sideEffect: false          # 会话级操作，不涉及任何业务数据——理由见 legacyNotes 第 1 条
    autoOrchestration: false   # 不被意图计划引用；由接触层 user-token-store 按需调用
    idempotentBusinessKey: null
    verification: null
    compensation: null
    preconditions: []
    adapter: auth-refresh
    legacyNotes:
      - 为什么标 sideEffect:false——它改的是 Redis 里的会话记录，不是存量业务数据；
        N3/N4 门槛针对的是"会被别人看见的业务写入"，此处无查证/补偿语义（同 auth.login 口径）
      - 源码核验（AuthController L137-147 + TokenServiceImpl.rotateRefreshToken）：接口存在，
        且**轮换**刷新令牌——旧的一次性作废
      - 设备不匹配返回 401（refreshToken 设备不匹配）；跳过认证过滤器，无 access token 也能调
      - ⚠️ 此前文档结论"存量系统无刷新令牌接口"是错的：该结论是三审"会话内存存明文密码"
        的唯一理由，故实现改为刷新令牌续期（见 docs/变更记录 登录实现登记）

  - id: auth.logout
    domain: auth
    method: POST
    path: /auth/logout
    timeoutClass: read
    purpose: 撤销本人的那个设备会话（登出）；引擎登出时同步调用，避免残留占用设备名额
    requiredIdentity: none
    sideEffect: false          # 同 auth.refresh：会话级，不是业务数据
    autoOrchestration: false   # 不被意图计划引用；由接入层登出端点调用
    idempotentBusinessKey: null
    verification: null
    compensation: null
    preconditions: []
    adapter: auth-logout
    legacyNotes:
      - 请求体是 refreshToken（不是 access token）；成功即撤销该设备会话并删除刷新令牌哈希
      - 跳过认证过滤器（JwtAuthenticationFilter.shouldNotFilter）——access token 已过期时仍可登出
      - 撤销成功后该设备上的 access token 立即失效（过滤器查 isDeviceSessionActive 为假 → 401）

  # ── 2~5 ── 事实查询（教务侧 edu）─────────────────────────────────────────
  - id: edu.classroom.detail
    domain: edu
    method: GET
    path: /classrooms/{id}
    timeoutClass: read
    purpose: 教室详情——把人读名解析成系统 id（实体消解），并读取 status（F1）
    requiredIdentity: TEACHER
    sideEffect: false
    autoOrchestration: true    # 两个意图的第 1 步
    idempotentBusinessKey: null
    verification: null
    compensation: null
    preconditions: []
    adapter: classroom-detail
    legacyNotes:
      - 资源不存在返回 HTTP 200 + code 400（不是 404——L-404 分叉，W13 只管创建/撤销语境）
      - status ∈ 启用集（常量 classroomEnabledStates）视为启用；其余值不可用且话术必须引用实际读到的值

  - id: edu.classroom.available
    domain: edu
    method: GET
    path: /classrooms/available_list
    timeoutClass: read
    purpose: 按楼栋与容量筛候选（仅降级时的候选池来源，F-候选）
    requiredIdentity: TEACHER
    sideEffect: false
    autoOrchestration: true
    idempotentBusinessKey: null
    verification: null
    compensation: null
    preconditions: []
    adapter: classroom-available
    legacyNotes:
      - 没有时间参数——答不了"这个时段是否可用"，禁止用它做时段冲突判定（第 01 章 §6.1 ②）
      - min_capacity 必填，缺失返回业务码 500 而非 400；不限容量时显式传 0
      - 不传 building 返回空列表（SQL building=NULL 恒假），并非全量（三审实测）
      - 它会返回已被占用的教室——结果只是候选池，每项仍须逐项走完整命题校验
      - 候选上限 K=5（常量 degrade.candidateLimit）

  - id: edu.classroom.seats
    domain: edu
    method: GET
    path: /classrooms/{id}/seats
    timeoutClass: read
    purpose: 座位布局（F2；仅"粒度差异"只读演示用，D1：保留但不在主链路）
    requiredIdentity: TEACHER
    sideEffect: false
    autoOrchestration: true
    idempotentBusinessKey: null
    verification: null
    compensation: null
    preconditions: []
    adapter: seat-list
    legacyNotes:
      - 主链路（教室级借用）不依赖它；F2 默认不收集（第 08 章 §6.3）

  - id: edu.classroom.reservedSeats
    domain: edu
    method: GET
    path: /classrooms/{id}/reserved_seats
    timeoutClass: read
    purpose: 该教室该时段被占座位（F3；时段占用判定的事实来源之一）
    requiredIdentity: TEACHER
    sideEffect: false
    autoOrchestration: true
    idempotentBusinessKey: null
    verification: null
    compensation: null
    preconditions: []
    adapter: reserved-seats
    legacyNotes:
      - 入参 start_time/end_time 必须带 Z 的偏移时间（第 06 章 §6.3 规格 2）
      - 返回座位 id 数组——读写粒度不一致，占用座位数 > 0 即视为整间不可用（第 08 章 §2.2 F3）
      - ★ 返回全量座位时原因不可区分（整间被预约 或 维修中，源码合并返回）——
        必须带 signalIsAmbiguous 标记并继续取 F6 交叉判定（P-SLOT-FREE 证据支点）

  # ── 6 ── 事实查询（后勤侧 logi，跨权限域）────────────────────────────────
  - id: logi.maintenance.list
    domain: logi
    method: GET
    path: /admin/maintenance
    timeoutClass: readHeavyList
    purpose: 维修窗口列表（F6；判定"是否在检修"）
    requiredIdentity: ADMIN
    sideEffect: false
    autoOrchestration: true
    idempotentBusinessKey: null
    verification: null
    compensation: null
    preconditions: []
    adapter: maintenance-list
    legacyNotes:
      - 需要 ADMIN（TEACHER/STUDENT 实测 HTTP 403，过滤器层拒绝）——跨权限域聚合的必然性所在
      - 失效集合用排除法（常量 maintenanceInvalidStates）；生效中 = status=ACTIVE 且时段严格重叠
      - 出参 camelCase（resourceType/resourceId/startTime），与入参 snake_case 不一致——适配层吸收

  # ── 7~12 ── 写入 / 查证 / 补偿 / 演示工具 ────────────────────────────────
  - id: edu.reservation.classroom.create
    domain: edu
    method: POST
    path: /reservations/classrooms
    timeoutClass: write
    purpose: 提交整间教室预约（主轴写入；唯一副作用出口的目的=正向写入）
    requiredIdentity: initiator  # 登录后：写操作只认登录者本人（登录方案决定 3）——不再是固定的教师账号
    sideEffect: true
    autoOrchestration: true
    idempotentBusinessKey: 身份+教室+时段   # 三元组（第 06 章 §二）；资源用系统 id
    verification:
      via: logi.reservation.list
      note: 跨身份可见，唯一能同时回答 Q1（谁写的）+ Q2（时段重叠）的路径
    compensation:
      action: edu.reservation.cancel
    preconditions:
      - P-CLASSROOM-EXISTS
      - P-CLASSROOM-ENABLED
      - P-NOT-ALREADY-MINE      # 先查本人，再查占用——顺序不可颠倒（第 06 章 §四）
      - P-SLOT-FREE
      - P-NOT-UNDER-MAINTENANCE
    adapter: reservation-create
    legacyNotes:
      - 有时间重叠冲突检测：重复提交返回 HTTP 200 + code 409，6 路并发只落库 1 条
      - ★ 409 是歧义信号（自己已成功 or 别人占了，响应字节级相同）——既不当成功也不当失败，
        必须查证收敛；查证前禁止重试（W2）
      - ADMIN 身份调用返回 HTTP 200 + code 403（方法层拒绝）——只看 HTTP 状态码会把越权当成功（W3）
      - TEACHER 在服务层豁免全部时长校验（J4 实测）；预约不得跨北京自然日、开始时间必须在未来
      - reason 为自由文本——因此幂等键不能用请求体哈希（第 06 章 §2.1）

  - id: edu.reservation.seat.create
    domain: edu
    method: POST
    path: /reservations/seats
    timeoutClass: write
    purpose: 提交座位预约（纳管留档；作为"粒度差异"的对照，D2：不进入自动编排）
    requiredIdentity: initiator  # 座位预约的发起人就是登录者本人（学生或教师），不再写死 STUDENT
    sideEffect: true
    autoOrchestration: false   # D2：座位预约不是主链路，不被任何意图计划引用（自检项 8）
    idempotentBusinessKey: 身份+座位+时段
    verification:
      via: edu.reservation.mine
      note: 座位预约查证用发起时身份（STUDENT）
    compensation:
      action: edu.reservation.cancel
    preconditions:
      - P-SEAT-EXISTS
      - P-SEAT-SLOT-FREE
    adapter: reservation-seat-create   # 阶段 1 修正：与教室创建的请求体字段不同（seat_id vs classroom_id），不得共用适配器
    legacyNotes:
      - 学生受信用分级时长上限约束（单次 A/B/C=360/180/120 分钟），超限返回 200+code 400（J4）
      - 座位预约另有 24h 提前窗口；教室预约无此限制

  - id: edu.reservation.mine
    domain: edu
    method: GET
    path: /reservations
    timeoutClass: read
    purpose: 我的预约（F5；前置查重降级路径 + 补偿查证降级路径）
    requiredIdentity: initiator   # 登录者本人（登录方案决定 3）：查证必须与发起写入时的同一身份
                                  # （只返回当前身份的 ACTIVE 记录——因此不能被服务身份替代）
    sideEffect: false
    autoOrchestration: true
    idempotentBusinessKey: null
    verification: null
    compensation: null
    preconditions: []
    adapter: reservation-mine-list
    legacyNotes:
      - 只返回当前身份的 ACTIVE 记录——用它查证必须用发起写入时的同一身份
      - 不能作跨身份反证（别人写的它看不到）：未命中不判"未生效"，必须与 F3/F4 交叉印证
      - 另有 /reservations/history 返回非 ACTIVE 记录——存在但不纳管（三审实测）

  - id: edu.reservation.cancel
    domain: edu
    method: DELETE
    path: /reservations/{id}
    timeoutClass: write
    purpose: 撤销预约（补偿动作；经补偿清单触发，不直接挂意图步骤）
    requiredIdentity: initiator  # 撤销接口只认"当前登录者自己的"记录（openapi）——因此必须用本人身份；
                                 # 撤别人的记录只能走管理员撤销接口（C14），不在这里
    sideEffect: true
    autoOrchestration: true    # 补偿动作：经补偿清单引用（第 01 章 §五 三审注）
    verdictFork: compensation  # W13/D10 分叉（阶段 1 增补字段）：本接口收到 200+400/404 时
                               # 不判失败，进 recordId 查证——分叉执行在规则表 W4/W13 行内
    idempotentBusinessKey: null
    businessKeyExempt: true    # 对补偿动作可豁免（第 01 章 §四）：重复撤销天然幂等
    verification:
      via: logi.reservation.list
      note: 补偿查证按 recordId 定位（不得按业务键，第 06 章 §8.1）；
            记录为 CANCELLED/EXPIRED/查无此 id 均判"撤销已生效"
    compensation:
      nonCompensable: true     # 显式登记：不存在"撤销补偿"这回事（N4 以登记满足）
      reason: 撤销动作自身不可撤销；补偿失败必须落 UNRESOLVED 并如实上报，禁止静默吞掉（I6）
    preconditions: []
    adapter: reservation-cancel
    legacyNotes:
      - 撤销返回码（D10 三审实测）：有效预约 200+200；已取消/结束已过 200+400；
        记录不存在 200+404；并发竞争 200+409
      - 400/404 在补偿语境不是"撤销技术失败"——一律按 recordId 查证收敛（W13 分叉）
      - 补偿请求同样会超时/返回歧义信号——与正向共用同一套三值判定与查证（第 04 章 §六 约束一）

  - id: logi.reservation.list
    domain: logi
    method: GET
    path: /admin/reservations
    timeoutClass: readHeavyList
    purpose: 管理端全量预约列表（F4；查证支点——跨身份可见）
    requiredIdentity: ADMIN
    sideEffect: false
    autoOrchestration: true
    idempotentBusinessKey: null
    verification: null
    compensation: null
    preconditions: []
    adapter: reservation-admin-list
    legacyNotes:
      - ★ 禁止用 keyword 做精确过滤（keyword=4 实测命中 16 条——user_id/resource_id/reason
        三字段 CAST 模糊匹配）；查证一律不带该参数，拉全量后内存比对
      - 不带参数返回全量纯数组（非分页对象）；无分页参数——设安全阈值 500（超阈仍比对，未命中才判查不清）
      - 复位基线 86 条（CLASSROOM 23 + SEAT 63，全非 ACTIVE）；已撤销记录留存、条数不减
      - 比对口径（J3）：仅计 ACTIVE；CLASSROOM 行按 resource_id、SEAT 行按 classroom_id 归并（C9）；
        占用谓词 status='ACTIVE' AND start<申请end AND end>申请start（严格不等号）
      - 需要 ADMIN（TEACHER/STUDENT 被拒）；签到/用量记录在独立表，不会混入本接口

  - id: logi.maintenance.create
    domain: logi
    method: POST
    path: /admin/maintenance
    timeoutClass: write
    purpose: 创建维修窗口（仅演示场景构造；M8：禁止自动编排清单的唯一成员）
    requiredIdentity: ADMIN
    sideEffect: true
    autoOrchestration: false   # M8：不可补偿的写操作禁止进入自动链路；仅演示脚本/人工触发（D4）
    idempotentBusinessKey: null
    businessKeyExempt: true    # 演示工具，不经编排链路，无查证比对需求
    verification:
      via: logi.maintenance.list
      note: 创建后可在列表中确认生效（演示脚本自用，不在编排链路上）
    compensation:
      nonCompensable: true     # 存量系统只有创建/取消，无按 ID 删除——N4 以登记满足
      reason: 不可逆；因此被 M8 禁止自动编排，两道冗余（数据标记 + 计划不引用）
    preconditions: []
    adapter: maintenance-create
    legacyNotes:
      - 请求体 resourceType（camel）与 start_time（snake）混用——命名异构实证，防腐层必要性的证据
      - 必须经接口创建（不得直接插库）——走接口才能证明"这是存量系统里本来就有的业务数据"
