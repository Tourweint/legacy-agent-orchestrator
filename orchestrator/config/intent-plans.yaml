# =============================================================================
# 意图计划 —— 第 13 章阶段 0 交付物 4（K4 三审拍板：独立成文件）
#
# 字段规格：第 13 章 §4.2。意图闭集与理解层输出同源（第 03 章 闸门一；
# 当前闭集：借教室、查询教室可用性——新增意图 = 本文件加一节）。
# 纪律：
#   · 步骤链只能引用 autoOrchestration: true 的接口（结构自检项 8）
#   · 槽位缺口 = 必填槽位 − 已提供键，由编排层机械计算（闸门三），不采信模型
#   · P-NOT-ALREADY-MINE 判定顺序在 P-SLOT-FREE 之前（第 06 章 §四：先本人后占用）
# =============================================================================

intents:

  # ── 主链路：借教室 ────────────────────────────────────────────────────────
  - id: borrow-classroom
    name: 借教室
    readOnly: false
    # 角色要求（登录方案决定 4/5）：整间教室的预约写操作只对教师开放。
    # 学生发起 → 在任何调用之前有依据拒绝，并给出替代动作（不是"操作失败"）。
    requiredRole: TEACHER
    roleDeniedMessage: 整间教室的预约只能由教师提交，您的账号是学生身份。我可以帮您查这间教室的空闲情况，或者帮您排这个时段的座位候补。
    roleAlternatives: [query-classroom-availability]
    # D7（决策汇总 §四）：一次借两间教室是合法输入——多资源由编排层按计划顺序
    # 组合多次运行，每运行承载一个资源生命周期（第 04 章 §5.8）
    multiResource: true
    slots:
      required: [classroomName, datePhrase, timeSegment]
      optional: [reason]          # 缺省值的业务口径未定——实现时确定并登记（第 03 章 §8.1：须标注"按默认处理"）
      # slotHints：理解层提示词的槽位释义（从计划生成，不手抄；阶段 5 增补）
      slotHints:
        classroomName: 教室名（用户原话，可一次说多间，如"数智楼123和222"）
        datePhrase: 日期说法（用户原话，如"周三""明天""10月1日"——不要换算成日期）
        timeSegment: 时段说法（用户原话，如"下午""晚上""上午八点到十点"）
    facts: [F1, F3, F4, F5, F6]   # F2 不在主链路（第 01 章 §6.1 ③）
    propositions:
      - P-CLASSROOM-EXISTS
      - P-CLASSROOM-ENABLED
      - P-NOT-ALREADY-MINE        # 先查本人（幂等命中 → ALREADY_DONE → DONE，决策 C6）
      - P-SLOT-FREE
      - P-NOT-UNDER-MAINTENANCE
    steps:
      - { step: resolve-classroom,  interface: edu.classroom.detail,            serves: "F1 + 实体消解" }
      - { step: occupied-seats,     interface: edu.classroom.reservedSeats,     serves: F3 }
      - { step: admin-reservations, interface: logi.reservation.list,           serves: "F4（不带 keyword，拉全量）" }
      - { step: my-reservations,    interface: edu.reservation.mine,            serves: "F5（发起时身份）" }
      - { step: maintenance-list,   interface: logi.maintenance.list,           serves: "F6（ADMIN，跨权限域）" }
      - { step: submit-reservation, interface: edu.reservation.classroom.create, serves: "提交（唯一写出口，仅 SUBMITTING 态发出）", role: submit }
    verification:
      # 三条路径与优先级：第 06 章 §五（首选 ADMIN 全量列表；降级 mine 须交叉印证）
      primary:  { interface: logi.reservation.list, identity: ADMIN }
      fallback: { interface: edu.reservation.mine,  identity: initiator }
      predicate:
        forward:    "Q1 + Q2 同时成立才判幂等命中：写入者=发起身份 且 时段严格重叠（第 06 章 §三）"
        compensate: "按 recordId 定位：CANCELLED/EXPIRED/查无此 id 均判'撤销已生效'（第 06 章 §8.1）"
    compensation:
      action: edu.reservation.cancel
      # recordId 不可得（如提交时响应丢失）→ 不得猜，直接 VERIFY_INCONCLUSIVE（第 06 章 §8.1）
      recordIdRequired: true
      listNotPersisted: true    # K3 三审拍板：补偿清单不持久化，随任务销毁
    resolution:
      candidatesFrom: edu.classroom.available   # 名字解析来源（人读名 → 候选列表匹配房间号）
    degrade:
      candidatesFrom: edu.classroom.available
      # available_list 只是候选池（无时间参数），每项仍逐项走完整命题校验；
      # 候选上限/轮次/不降容量等数值全部来自 constants.yaml 的 degrade 节
      note: 用户未指定具体教室时不进入降级（没有同楼栋与不降容量的基准，第 08 章 §8.1）
    # 用户取消仅写请求发出前生效（B8）；提交后取消为忽略型无边（第 04 章 §5.9）

  # ── 只读意图：查询教室可用性 ─────────────────────────────────────────────
  - id: query-classroom-availability
    name: 查询教室可用性
    readOnly: true              # 决定终态是 DONE（CHECK_ONLY），不进入提交
    multiResource: false
    slots:
      required: [classroomName, datePhrase, timeSegment]
      optional: []
      slotHints:
        classroomName: 教室名（用户原话，如"数智楼222"）
        datePhrase: 日期说法（用户原话——不要换算成日期）
        timeSegment: 时段说法（用户原话，如"下午"）
    facts: [F1, F3, F4, F5, F6]   # F5 支撑 P-SLOT-FREE 的降级交叉印证（F4 不可得时）；F2 不在链路（第 01 章 §6.1 ③）
    propositions:
      - P-CLASSROOM-EXISTS
      - P-CLASSROOM-ENABLED
      - P-SLOT-FREE
      - P-NOT-UNDER-MAINTENANCE   # 无写入，无 P-NOT-ALREADY-MINE
    steps:
      - { step: resolve-classroom,  interface: edu.classroom.detail,          serves: "F1 + 实体消解" }
      - { step: occupied-seats,     interface: edu.classroom.reservedSeats,   serves: F3 }
      - { step: admin-reservations, interface: logi.reservation.list,         serves: F4 }
      - { step: maintenance-list,   interface: logi.maintenance.list,         serves: F6 }
    resolution:
      candidatesFrom: edu.classroom.available   # 查询意图不降级，但名字解析仍需要它
    verification: null
    compensation: null
    degrade: null                 # 查询无降级：被占/检修都如实答复，不"换一间替你问"

  # ── C7 查：我订了哪些教室 ─────────────────────────────────────────────────
  # 目标**不是教室**而是"我自己的记录"：因此声明 requiresEntityResolution: false——
  # 引擎跳过"教室名 → 教室 id"那一步（否则会拿空教室名去解析，必然解析失败）。
  - id: query-my-reservations
    name: 查询我的预约
    readOnly: true                # 只读：不进入提交，直接给结论
    multiResource: false
    requiresEntityResolution: false
    slots:
      required: []                # 什么都不必说："我订了哪些教室"就能办
      optional: [classroomName, datePhrase, timeSegment]   # 说了就用来过滤
      slotHints:
        classroomName: 教室名（可选，如"数智楼123"——只看这一间）
        datePhrase: 日期说法（可选，如"周三"——不要换算成日期）
        timeSegment: 时段说法（可选，如"下午"）
    facts: [F5]
    propositions: []              # 没有"能不能办"的判定——它只是把事实说给用户听
    readOnlyAnswer:
      fromFact: F5                # 答案由"我的预约"这条事实生成（不是拼命题结论）
    steps:
      - { step: my-reservations, interface: edu.reservation.mine, serves: "F5（登录者本人的 ACTIVE 记录）" }
    resolution: { kind: none }    # 只读列举：没有"要操作的那一条"可定位，直接进事实收集
    verification: null
    compensation: null
    degrade: null

  # ── C7 退：把周三那间退了 ─────────────────────────────────────────────────
  # 撤销是**用户的目的**，不是副作用：所以 compensation 为 null（撤销失败就是失败，
  # 不做"重新订回来"）。唯一要守的规矩是"只能撤自己的"——由命题 P-IS-MINE 守。
  - id: cancel-my-reservation
    name: 撤销我的预约
    readOnly: false
    multiResource: false
    requiresEntityResolution: false
    slots:
      required: []
      optional: [classroomName, datePhrase, timeSegment]
      slotHints:
        classroomName: 教室名（可选，如"数智楼123"——用来在您的预约里定位是哪一条）
        datePhrase: 日期说法（可选，如"周三"）
        timeSegment: 时段说法（可选，如"下午"）
    facts: [F5]
    propositions: [P-IS-MINE]
    steps:
      - { step: my-reservations,    interface: edu.reservation.mine,   serves: "F5（先知道有哪些，才谈得上撤哪条）" }
      - { step: cancel-reservation, interface: edu.reservation.cancel, serves: 提交, role: submit,
          params: { recordId: "target.recordId" } }   # 参数按计划声明组装（撤销要的是记录编号，不是教室+时段）
    verification:
      primary:  { interface: logi.reservation.list, identity: ADMIN }
      fallback: { interface: edu.reservation.mine,  identity: initiator }
      byRecord: true              # 撤销语境的查证一律按 recordId 定位（第 06 章 §8.1）
      predicate:
        forward:    "按 recordId 定位：查无此 id 或状态非 ACTIVE = 撤销已生效（第 06 章 §8.1）"
        compensate: "同上——撤销即目的，不存在二次补偿"
    compensation: null            # 撤销是目的而非副作用（能力清单 C7）
    successMessage: 已为您撤销，该预约不再生效
    resolution: { kind: my-reservation }
    degrade: null
